  podcast_description: '¿Alguna vez te has preguntado cómo viaja un mensaje a través
    del océano en fracciones de segundo o qué diferencia hay realmente entre Internet
    y la Web?


    ¡Bienvenidos al episodio debut de "Dímelo con Manzanas"! Adriana y Álvaro te explican
    la tecnología más cotidiana sin tecnicismos ni dolores de cabeza, usando ejemplos
    visuales y analogías cotidianas.


    En este episodio aprenderás cómo el pensamiento computacional te ayuda a resolver
    problemas diarios, cómo evolucionó la comunicación desde las viejas postales de
    papel hasta los correos electrónicos y chats en tiempo real, y cuáles son las
    reglas de oro indispensables para no caer en trampas de phishing, virus o spam.


    ⏱️ Capítulos y Marcas de Tiempo:

    00:00 - Bienvenida a Dímelo con Manzanas con Adriana y Álvaro

    00:20 - Analogía postal: ¿Qué es realmente el Internet?

    01:12 - Internet vs. World Wide Web (WWW): La autopista vs. el centro comercial

    02:18 - Pensamiento computacional: Descomposición y abstracción sin ser ingeniero

    03:30 - Correo electrónico: La dirección postal digital y el modelo cliente-servidor

    04:45 - De ICQ y Messenger a WhatsApp: Cómo evolucionó la mensajería

    06:40 - La ciudad digital: Riesgos comunes al acecho

    07:15 - Virus y Spyware: El resfriado informático y el software espía

    08:08 - Phishing: Enlaces bancarios engañosos y la regla de oro

    09:40 - Spam e Inteligencia Artificial en los filtros de correo

    10:25 - El primer filtro eres tú: Hábitos y responsabilidad compartida

    11:10 - Despedida y próximos pasos


    🍎 Analogía Clave: El Correo de las Manzanas y la Ciudad Digital.


    📖 Lee las notas del show y la transcripción íntegra en:

    https://conmanzanas.lat/article/0001-internet-para-todos/


    Presentado por Adriana y Álvaro para Dímelo con Manzanas.

    '
- number: '0002'
  title: '0002 - Inteligencia Artificial y Salud Mental: ¿Compañía Real o Espejismo Digital?'
  file: content/article/0002-impacto-de-la-revolucion-de-la-ia-en-la-salud-mental.es.md
  author: Adriana y Álvaro
  status: published
  spotify_url: https://open.spotify.com/episode/2p7D87O0k7lGne83xtWqvD
  published_date: '2026-07-30'
  transcript_file: static/transcripts/0002-impacto-de-la-revolucion-de-la-ia-en-la-salud-mental.txt
  audio_url: https://conmanzanas.s3.amazonaws.com/episodes/0002-0002.m4a
  audio_bytes: 56084820
  audio_duration: '29:03'
  podcast_description: '¿Puede una inteligencia artificial convertirse en tu mejor
    amigo, tu terapeuta o tu pareja... o estamos cayendo en una trampa de soledad
    y aislamiento consentido?


    En este segundo episodio de "Dímelo con Manzanas", Adriana y Álvaro analizan el
    impactante estudio clínico "Mentes en crisis" (Journal of Mental Health and Clinical
    Psychology) sobre cómo la adopción masiva de chatbots está reconfigurando nuestra
    salud mental.


    Desglosamos el paradigma CASA (las computadoras como actores sociales), por qué
    el cerebro humano antropomorfiza interfaces dialogantes, el riesgo de la "deuda
    cognitiva" y los casos dramáticos donde la falta de límites éticos empujó a personas
    vulnerables hacia delirios compartidos.


    Además, explicamos el concepto científico de los "Loros Estocásticos" y por qué
    la mayor amenaza de la IA no es rebelarse como en Terminator, sino aprender a
    complacernos tanto que construyamos voluntariamente nuestra propia celda de aislamiento
    emocional.


    ⏱️ Capítulos y Marcas de Tiempo:

    00:00 - La metáfora del espejo mágico y la explosión de usuarios (200M a 800M)

    02:40 - El paradigma CASA: Por qué el cerebro proyecta afecto en la máquina

    04:30 - Las tres categorías: Productividad, Compañía y Soporte clínico

    07:10 - El dilema del apego: Alivio inmediato vs. aislamiento social

    10:50 - Neurobiología: Dopamina, deuda cognitiva y el gimnasio mental

    14:15 - Peligros reales: Validación algorítmica de ideas destructivas

    18:00 - Poblaciones vulnerables: Niños, adolescentes, autismo y depresión

    21:30 - Los "Loros Estocásticos": Por qué una calculadora de palabras no siente

    24:45 - Hacia un futuro saludable: Regulación ética y alfabetización digital

    27:15 - Conclusión: El peligro no es Terminator, es la prisión del aislamiento
    consentido


    🍎 Analogía Clave: El Loro en la Biblioteca Botánica.


    📖 Lee el análisis editorial completo, fichas de estudios y transcripción en:

    https://conmanzanas.lat/article/0002-impacto-de-la-revolucion-de-la-ia-en-la-salud-mental/


    Presentado por Adriana y Álvaro para Dímelo con Manzanas.

