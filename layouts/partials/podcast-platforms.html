<div class="podcast-platforms-bar" aria-label="Plataformas de reproducción">
  <span class="platforms-label">Escúchanos en:</span>
  <div class="platforms-list">
    {{ with .Site.Params.spotifyShow }}
    <a href="{{ . }}" target="_blank" rel="noopener noreferrer" class="platform-btn platform-spotify" title="Escuchar en Spotify" aria-label="Escuchar en Spotify">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
        <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.502 17.31c-.216.353-.675.467-1.028.25-2.816-1.72-6.36-2.11-10.536-1.157-.404.092-.81-.16-.902-.564-.092-.403.16-.81.564-.902 4.568-1.043 8.49-.603 11.652 1.344.353.217.467.675.25 1.029zm1.468-3.262c-.272.441-.85.582-1.291.31-3.224-1.982-8.139-2.553-11.954-1.395-.497.151-1.026-.135-1.177-.633-.151-.497.135-1.026.633-1.177 4.356-1.322 9.774-.683 13.48 1.595.44.272.581.85.309 1.29zm.126-3.41c-3.867-2.296-10.245-2.508-13.929-1.39-.594.18-1.222-.16-1.402-.754-.18-.594.16-1.222.754-1.402 4.238-1.286 11.281-1.036 15.727 1.603.535.318.71 1.01.392 1.545-.317.535-1.01.71-1.542.398z"/>
      </svg>
      <span>Spotify</span>
    </a>
    {{ end }}

    {{ with .Site.Params.applePodcasts }}
    <a href="{{ . }}" target="_blank" rel="noopener noreferrer" class="platform-btn platform-apple" title="Escuchar en Apple Podcasts" aria-label="Escuchar en Apple Podcasts">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.4c.64-.78 1.08-1.86.96-2.95-1 .04-2.14.67-2.8 1.45-.58.67-1.1 1.77-.96 2.83 1.12.09 2.19-.58 2.8-1.33z"/>
      </svg>
      <span>Apple Podcasts</span>
    </a>
    {{ end }}

    {{ with .Site.Params.youtubeChannel }}
    <a href="{{ . }}" target="_blank" rel="noopener noreferrer" class="platform-btn platform-youtube" title="Ver en YouTube" aria-label="Ver en YouTube">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
      </svg>
      <span>YouTube</span>
    </a>
    {{ end }}

    {{ with .Site.Params.pocketCasts }}
    <a href="{{ . }}" target="_blank" rel="noopener noreferrer" class="platform-btn platform-pocketcasts" title="Escuchar en Pocket Casts" aria-label="Escuchar en Pocket Casts">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
        <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm0 3.273c4.82 0 8.727 3.907 8.727 8.727a8.694 8.694 0 0 1-2.556 6.171l-1.92-1.92A5.969 5.969 0 0 0 18 12c0-3.314-2.686-6-6-6a5.969 5.969 0 0 0-4.251 1.777l-1.92-1.92A8.694 8.694 0 0 1 12 3.273zm0 5.454c1.958 0 3.545 1.587 3.545 3.545 0 .98-.398 1.867-1.039 2.507l-1.92-1.92c.137-.173.221-.392.221-.631 0-.573-.464-1.037-1.037-1.037a1.03 1.03 0 0 0-.631.221l-1.92-1.92A3.523 3.523 0 0 1 12 8.727z"/>
      </svg>
      <span>Pocket Casts</span>
    </a>
    {{ end }}

    <a href="{{ "/index.xml" | relURL }}" class="platform-btn platform-rss" title="Feed RSS del Podcast" aria-label="Feed RSS del Podcast">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
        <path d="M6.18 15.64a2.18 2.18 0 0 1 2.18 2.18C8.36 19 7.38 20 6.18 20C5 20 4 19 4 17.82a2.18 2.18 0 0 1 2.18-2.18M4 4.44A15.56 15.56 0 0 1 19.56 20h-2.83A12.73 12.73 0 0 0 4 7.27zm0 5.66a9.9 9.9 0 0 1 9.9 9.9h-2.83A7.07 7.07 0 0 0 4 12.93z"/>
      </svg>
      <span>RSS</span>
    </a>
  </div>
</div>
