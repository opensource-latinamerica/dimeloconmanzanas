baseURL = "https://conmanzanas.lat"
languageCode = "es-ES"
title = "Dímelo con manzanas"
DefaultContentLanguage = "es"
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = "github.com/mirmousaviii/mostafa-hugo-theme"

[menus]
  [[menus.main]]
    name = "Inicio"
    url = "/"
    weight = 10

  [[menus.main]]
    name = "Episodios"
    url = "/categories/episodio/"
    weight = 20

  [[menus.main]]
    name = "Noticias"
    url = "/categories/anuncio/"
    weight = 30

  [[menus.main]]
    name = "Manzaneros"
    url = "/manzaneros/"
    weight = 40

[params]
    logo = "image_1758312870445.webp"
    author = "Adriana y Álvaro"
    description = "Explorando ideas complejas con explicaciones sencillas."
    pinnedPost = "/article/bienvenido/"
    spotifyShow = "https://open.spotify.com/show/5e8y2Z7Tts9e5Llr7pxXo3"
    spotifyHeaderType = "widget" # Options: "widget" (embedded player) or "button" (direct follow button)
    colorTheme = "dark" # Palettes: "dark" (Noche Frutal - default), "light" (Huerto Soleado), "tropical" (Fiesta Pop)


[Languages]
    [Languages.es]
        weight = 10
        languageCode = 'es'
        languageDirection = 'ltr'
        languageName = 'Español'
        title = "Dímelo con manzanas"
        [Languages.es.params]
            subtitle = "Explorando ideas complejas con explicaciones sencillas."

[params.podcast]
    author = "Adriana y Álvaro"
    ownerName = "Álvaro Soto"
    ownerEmail = "contacto@conmanzanas.lat"
    category = "Technology"
    secondaryCategory = "Education"
    explicit = "no"
    image = "podcast-cover.jpg"
    language = "es-ES"

[mediaTypes."application/podcast+xml"]
    suffixes = ["xml"]

[outputFormats.Podcast]
    mediaType = "application/podcast+xml"
    baseName = "podcast"
    isPlainText = false
    notAlternative = true

[outputs]
    home = [ "HTML", "RSS", "JSON", "Podcast" ]
