baseURL = "https://conmanzanas.lat"
languageCode = "es-ES"
title = "Dímelo con manzanas"
DefaultContentLanguage = "es"
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = "github.com/mirmousaviii/mostafa-hugo-theme"

[menus]
  [[menus.main]]
    name = "Inicio"
    url = "/"
    weight = 10

  [[menus.main]]
    name = "Autores"
    url = "/author/adriana-y-alvaro/"
    weight = 20

  [[menus.main]]
    name = "Episodios"
    url = "/categories/episodio/"
    weight = 30

[params]
    logo = "image_1758312870445.webp"
    author = "Adriana y Álvaro"
    description = "Explorando ideas complejas con explicaciones sencillas."
    pinnedPost = "/article/bienvenido/"
    spotifyShow = "https://open.spotify.com/show/5e8y2Z7Tts9e5Llr7pxXo3"
    spotifyHeaderType = "widget" # Options: "widget" (embedded player) or "button" (direct follow button)
    colorTheme = "dark" # Palettes: "dark" (Noche Frutal - default), "light" (Huerto Soleado), "tropical" (Fiesta Pop)


[Languages]
    [Languages.es]
        weight = 10
        languageCode = 'es'
        languageDirection = 'ltr'
        languageName = 'Español'
        title = "Dímelo con manzanas"
        [Languages.es.params]
            subtitle = "Explorando ideas complejas con explicaciones sencillas."

[outputs]
    home = [ "HTML", "RSS", "JSON" ]
